<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #1976d2, #7b1fa2);
      color: #fff;
      text-align: center;
      padding: 16px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px 24px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 6vw, 2.4rem); }
    p { margin: 0 0 24px; font-size: clamp(1rem, 3.5vw, 1.15rem); line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #fff;
      color: #1976d2;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>안녕하세요, 하미입니다 👋</h1>
    <p>나의 첫 번째 웹사이트에 오신 것을 환영합니다.<br>React와 MUI로 웹 개발을 배우고 있어요.</p>
    <a href="https://github.com/Hami-kim521">GitHub 방문하기</a>
  </main>
</body>
</html>
